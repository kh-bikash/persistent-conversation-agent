[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-conversation-agent"
version = "0.1.0"
description = "Durable memory, relevant recall, and context compression."
requires-python = ">=3.11"
dependencies = ["pydantic[email]>=2.8,<3", "fastapi>=0.115,<1", "httpx>=0.27,<1"]

[project.scripts]
conversation-memory = "persistent_conversation_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
